server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.mjs$ {
        types { text/javascript mjs; }
        try_files $uri =404;
    }

    location ~ \.wasm$ {
        types { application/wasm wasm; }
        try_files $uri =404;
    }

    location ~ \.task$ {
        default_type application/octet-stream;
        try_files $uri =404;
    }
}
